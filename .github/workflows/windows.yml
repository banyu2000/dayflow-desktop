name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with .NET Framework
        shell: powershell
        run: .\build.ps1
      - name: Data and WPF construction checks
        shell: powershell
        run: .\scripts\test.ps1
      - name: Package portable application
        shell: powershell
        run: .\scripts\package.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v5
        with:
          name: DayFlow-windows
          path: dist/DayFlow-*-windows.zip
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: test-output/**/test-result.txt
          if-no-files-found: ignore
